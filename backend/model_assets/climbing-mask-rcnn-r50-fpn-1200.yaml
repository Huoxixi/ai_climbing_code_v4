_BASE_: "detectron2-base-rcnn-fpn.yaml"
MODEL:
  DEVICE: "cpu"
  MASK_ON: true
  WEIGHTS: ""
  ANCHOR_GENERATOR:
    SIZES: [[32, 64]]
  RESNETS:
    DEPTH: 50
  RPN:
    PRE_NMS_TOPK_TEST: 12000
    POST_NMS_TOPK_TEST: 2000
  ROI_HEADS:
    IN_FEATURES: ["p2", "p3"]
    NUM_CLASSES: 2
    SCORE_THRESH_TEST: 0.4
INPUT:
  FORMAT: "BGR"
  MIN_SIZE_TEST: 1200
  MAX_SIZE_TEST: 2000
TEST:
  DETECTIONS_PER_IMAGE: 300
VERSION: 2
