server {
    listen 80;
    listen [::]:80;
    server_name climb.panyandingxian.cn;

    access_log /var/log/nginx/ai_climbing_teacher_acme_access.log combined;
    error_log /var/log/nginx/ai_climbing_teacher_acme_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-climbing-certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
