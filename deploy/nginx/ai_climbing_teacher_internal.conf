server {
    listen 127.0.0.1:8443 ssl;
    server_name climb.panyandingxian.cn;

    root /opt/ai-climbing/current/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    ssl_certificate /etc/ai-climbing/tls/teacher-internal.crt;
    ssl_certificate_key /etc/ai-climbing/tls/teacher-internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIClimbingTeacherTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    auth_basic "AI Climbing Pilot";
    auth_basic_user_file /etc/nginx/ai-climbing-teacher-users.htpasswd;

    limit_req zone=ai_climbing_teacher_per_ip burst=120 nodelay;
    limit_conn ai_climbing_teacher_conn 20;

    access_log /var/log/nginx/ai_climbing_teacher_access.log combined;
    error_log /var/log/nginx/ai_climbing_teacher_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /docs {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location ^~ /api/simulation/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-Pilot-Access operator;
        proxy_set_header X-Pilot-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /photo-route-assets/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-Pilot-Access operator;
        proxy_set_header X-Pilot-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header X-Pilot-Access operator;
        proxy_set_header X-Pilot-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
